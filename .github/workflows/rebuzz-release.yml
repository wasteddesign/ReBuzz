name: ReBuzz Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install Windows Desktop workload
      run: dotnet workload install windowsdesktop        

    - name: Restore dependencies
      run: dotnet restore ReBuzz/ReBuzz.csproj

    - name: Build ReBuzz (Release)
      run: dotnet build ReBuzz/ReBuzz.csproj --configuration Release --no-restore

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rebuzz-release-v${{ github.ref_name }}
        path: ReBuzz/bin/Release/
